<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des produits</title>
</head>
<body>
    <h1>Nos Produits</h1>

    <a href="{% url 'category_list' %}">Voir les catégories</a>

    <ul>
        {% for product in products %}
            <li style="margin-bottom: 20px;">
                <h3>
                    <a href="{% url 'product_detail' product.id %}">
                        {{ product.name }}
                    </a>
                </h3>

                <p><strong>Prix :</strong> {{ product.price }} DH</p>

                <p>
                    <strong>Catégorie :</strong>
                    <a href="{% url 'category_detail' product.category.id %}">
                        {{ product.category.name }}
                    </a>
                </p>

                {% if product.image %}
                    <img src="{{ product.image.url }}" width="150" alt="{{ product.name }}">
                {% endif %}
            </li>
        {% empty %}
            <p>Aucun produit disponible.</p>
        {% endfor %}
    </ul>
</body>
</html>
