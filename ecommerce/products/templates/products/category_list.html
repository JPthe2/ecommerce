<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des catégories</title>
</head>
<body>
    <h1>Catégories</h1>

    <ul>
        {% for category in categories %}
            <li>
                <a href="{% url 'category_detail' category.id %}">
                    {{ category.name }}
                </a>
            </li>
        {% empty %}
            <p>Aucune catégorie disponible.</p>
        {% endfor %}
    </ul>

    <a href="{% url 'product_list' %}">Voir les produits</a>
</body>
</html>
